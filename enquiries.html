<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="css/style.css">
    <title>Enquiries - Sweet Cakes Bakery</title>
</head>

<body>
    <input type="checkbox" id="menu-check" class="menu-check">
    <header>
        <nav>
            <!--this logo goes to the home page-->
            <a href="index.html"><img src="images/sweet-cakes-bakery-logo.png" class="logo" alt="logo" width="100"
                    height="100"></a>
                     <!-- Phone logo: opens the sidebar -->
            <label for="menu-check" class="logo-label">
                <img src="images/sweet-cakes-bakery-logo.png" class="logo" alt="Open menu" width="100" height="100">
            </label>
            <ul class="navigation" id="Menu">
                <li class="close-item"><label for="menu-check">✕ Close</label></li>
                <li><a href="index.html"><span class="nav-icon">🏠</span> Home</a></li>
                <li><a href="about.html"><span class="nav-icon">ℹ️</span> About</a></li>
                <li><a href="menu.html"><span class="nav-icon">🍰</span> Menu</a></li>
                <li><a href="enquiries.html"><span class="nav-icon">📝</span> Enquiries</a></li>
                <li><a href="contact.html"><span class="nav-icon">📞</span> Contact</a></li>
            </ul>
        </nav>
        <!--a dark area clicking this will close the sidebar-->
        <label for="menu-check" class="menu-overlay"></label>
    </header>
    <main>
    <div class="tin-1">
    <h1><em>Complete Sweet Cakes Enquiries and place orders</em></h1>
    </div>        
    <section class="body-3"><!--for this section im going to make the boxes bigger and center the text-->
        <form class="form">
        <div class="inside">
            <div class="tins">
            <label for="first-name">First-name:</label>
            <input type="text" id="first-name" name="first name" placeholder="Enter your first name">
            </div>
            <div class="tins">
            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" placeholder="Enter your surname">
            </div>
            <div class="tins">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="tins">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age">
            </div>
            <div class="tins">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            </div>
            <div class="tins">
            <label for="message">Order:</label>
            <textarea id="message" name="order" placeholder="Enter your order here..."></textarea>
            </div>
            <div class="tins">
            <label for="date">Date:</label>
            <input type="date" id="date" name="Date">
            </div>
        
            <div class="submit-1">
            <button type="submit">Submit</button>
            
            </div>
        </div>
        </form>
    </section>
</main>
</body>

</html>
