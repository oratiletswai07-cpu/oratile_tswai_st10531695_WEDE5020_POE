<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries - Sweet Cakes Bakery</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html"> <img src="images/sweet-cakes-bakery-logo.png" alt="logo" width="100" height="100"></a>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="menu.html">Menu</a> |
            <a href="enquiries.html">Enquiries</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
       <hr>
    <br>
    <h1><em>Complete Sweet Cakes Enquiries and place orders</em></h1>
    <hr>
    <br>
    <section><!--for this section im going to make the boxes bigger and center the text-->
        <form>
            <label for="first-name">First-name:</label>
            <input type="text" id="first-name" name="first name" placeholder="Enter your first name">
            <br>
            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" placeholder="Enter your surname">
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age">
            <br>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br>
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Enter your message here..."></textarea>
            <br>
            <label for="date">Date:</label>
            <input type="date" id="date" name="Date">
            <br>
            <input type="submit" name="submit" value="Submit">
        </form>
    </section>
</main>
</body>

</html>
